<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#080810"/>
  
  <!-- Dumbbell bar -->
  <rect x="156" y="240" width="200" height="32" rx="8" fill="#00d4ff"/>
  
  <!-- Left weight plates -->
  <rect x="100" y="196" width="36" height="120" rx="10" fill="#00d4ff" opacity="0.9"/>
  <rect x="68" y="212" width="36" height="88" rx="10" fill="#00d4ff" opacity="0.7"/>

  <!-- Right weight plates -->
  <rect x="376" y="196" width="36" height="120" rx="10" fill="#00d4ff" opacity="0.9"/>
  <rect x="408" y="212" width="36" height="88" rx="10" fill="#00d4ff" opacity="0.7"/>

  <!-- Weight trend line (rising, bottom right) -->
  <polyline
    points="168,390 220,370 272,350 324,320 360,295"
    fill="none"
    stroke="#f59e0b"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.95"
  />
  <!-- Trend dots -->
  <circle cx="168" cy="390" r="9" fill="#f59e0b"/>
  <circle cx="220" cy="370" r="9" fill="#f59e0b"/>
  <circle cx="272" cy="350" r="9" fill="#f59e0b"/>
  <circle cx="324" cy="320" r="9" fill="#f59e0b"/>
  <circle cx="360" cy="295" r="9" fill="#f59e0b"/>
</svg>
